<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processos Higa · Painéis</title>
<style>
:root{--bg:#f4f6f5;--surface:#fff;--line:#dce2df;--ink:#111614;--muted:#4a5550;--accent:#0e6b5c}
@media (prefers-color-scheme:dark){:root{--bg:#0e1211;--surface:#161b19;--line:#29312e;--ink:#edf2ef;--muted:#b1bbb6;--accent:#43b59f;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px}
h1{font-size:1.9rem;margin:0 0 6px}
p.lede{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card h2{font-size:1.1rem;margin:0 0 6px;color:var(--accent)}
a.card p{margin:0;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
<h1>Processos Higa</h1>
<p class="lede">Painéis de RH. Acesso com a senha da equipe.</p>
<div class="grid">
<a class="card" href="horas-extras-rede/"><h2>Horas Extras · Rede Higa</h2><p>Painel de horas extras de todas as lojas.</p></a>
<a class="card" href="horas-extras-campinas-amarais/"><h2>Horas Extras · Campinas Amarais</h2><p>Painel de horas extras da loja Campinas Amarais.</p></a>
</div>
</div>
</body>
</html>
